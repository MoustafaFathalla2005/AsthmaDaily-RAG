<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AsthmaDaily</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
      <div class="container content">
        <a class="navbar-brand" href="/">AsthmaDaily</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/diary">Daily Diary</a></li>
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/ask_form">Clinical Q&amp;A</a></li>
          </ul>
          <form class="d-flex" action="/" method="get">
            <div class="btn-group me-2">
              <a class="btn btn-outline-primary" href="/?lang=en">EN</a>
              <a class="btn btn-outline-primary" href="/?lang=ar">AR</a>
            </div>
            <a class="btn btn-outline-primary" href="/">Home</a>
          </form>
        </div>
      </div>
    </nav>

    <div class="container content py-4" id="mainContent">
      {% block content %}{% endblock %}
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // show toast helper
      function showToast(message){
        const container = document.getElementById('toastContainer');
        const toastEl = document.createElement('div');
        toastEl.className='toast align-items-center text-bg-primary border-0';
        toastEl.setAttribute('role','alert');
        toastEl.setAttribute('aria-live','assertive');
        toastEl.innerHTML = `<div class="d-flex"><div class="toast-body">${message}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
        container.appendChild(toastEl);
        const t = new bootstrap.Toast(toastEl,{delay:3000});
        t.show();
      }
      // automatically show saved toast if present
      (function(){
        const params = new URLSearchParams(window.location.search);
        // language handling (persist via cookie)
        if(params.get('lang')){
          document.cookie = `lang=${params.get('lang')}; path=/`;
        }
        const lang = (document.cookie.match(/(^|;)\s*lang=([^;]+)/)||[])[2] || 'en';
        if(lang==='ar'){
          document.documentElement.dir = 'rtl';
          document.getElementById('mainContent').classList.add('rtl');
        }
        if(params.get('saved')){
          showToast(lang==='ar' ? 'تم حفظ الإدخال' : 'Entry saved');
          // remove saved param without reload
          params.delete('saved');
          const newurl = window.location.pathname + (params.toString() ? '?'+params.toString() : '');
          window.history.replaceState({}, document.title, newurl);
        }
      })();
    </script>

  </body>
</html>
